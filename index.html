<div id="app" class="w-full max-w-md h-full sm:h-[852px] bg-ecm-bg sm:rounded-[44px] shadow-2xl flex flex-col overflow-hidden relative border-0 sm:border-[10px] sm:border-slate-800">

<header class="bg-ecm-green text-white px-6 pt-3 pb-2 flex justify-between items-center text-xs font-semibold z-30 shrink-0">

      </div>

<script>
/* ==================== MANIFEST PWA (inline) ==================== */
(function() {
  const iconSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#08582B"/><stop offset="1" stop-color="#023317"/></linearGradient></defs><rect width="512" height="512" rx="96" fill="url(#g)"/><circle cx="256" cy="240" r="110" fill="#FF5722"/><path d="M180 240 Q256 140 332 240 Q256 340 180 240Z" fill="#FFFFFF"/><text x="256" y="440" font-family="Arial,sans-serif" font-size="80" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">E-CM</text></svg>`;
  const iconDataUri = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(iconSVG)));

  // Icône dynamique dans le <head>
  const favicon = document.createElement('link');
  favicon.rel = 'icon'; favicon.type = 'image/svg+xml'; favicon.href = iconDataUri;
  document.head.appendChild(favicon);
  const appleIcon = document.createElement('link');
  appleIcon.rel = 'apple-touch-icon'; appleIcon.href = iconDataUri;
  document.head.appendChild(appleIcon);

  // Manifest en Blob
  const manifest = {
    name: "E-CM | Ustensiles & Électroménager",
    short_name: "E-CM",
    description: "Ustensiles de cuisine et électroménager de qualité à Ouagadougou. Édité par Issa Camara.",
    start_url: ".",
    scope: ".",
    display: "standalone",
    orientation: "portrait",
    background_color: "#034B22",
    theme_color: "#034B22",
    lang: "fr",
    categories: ["shopping", "lifestyle"],
    icons: [
      { src: iconDataUri, sizes: "512x512", type: "image/svg+xml", purpose: "any" },
      { src: iconDataUri, sizes: "512x512", type: "image/svg+xml", purpose: "maskable" }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
  document.getElementById('manifest-link').href = URL.createObjectURL(blob);
})();

/* ==================== SERVICE WORKER (inline via Blob) ==================== */
(function() {
  const swCode = `
    const CACHE = 'ecm-v1';
    self.addEventListener('install', (e) => { self.skipWaiting(); });
    self.addEventListener('activate', (e) => { e.waitUntil(self.clients.claim()); });
    self.addEventListener('fetch', (e) => {
      if (e.request.method !== 'GET') return;
      e.respondWith(
        caches.match(e.request).then(cached => {
          const fetchPromise = fetch(e.request).then(res => {
            if (res && res.status === 200 && (res.type === 'basic' || res.type === 'cors')) {
              const clone = res.clone();
              caches.open(CACHE).then(c => c.put(e.request, clone)).catch(() => {});
            }
            return res;
          }).catch(() => cached);
          return cached || fetchPromise;
        })
      );
    });
  `;
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    const swBlob = new Blob([swCode], { type: 'application/javascript' });
    const swUrl = URL.createObjectURL(swBlob);
    window.addEventListener('load', () => {
      navigator.serviceWorker.register(swUrl, { scope: './' }).catch(() => {});
    });
  }
})();

/* ==================== DONNÉES ==================== */
const DEFAULT_PRODUCTS = [
  { id:'prod-1', name:'Friteuse sans huile 8L', category:'Electromenager', price:69900, oldPrice:79900, badge:'En stock', image:'https://images.unsplash.com/photo-1626143509930-b18429ef994e?w=600&auto=format&fit=crop&q=80', rating:4.8, reviewsCount:128, description:"Profitez de repas sains avec cette friteuse sans huile 8L sélectionnée par Issa Camara.", specs:['Capacité: 8 Litres','Écran tactile LED','Température réglable','Minuterie intégrée'] },
  { id:'prod-2', name:'Blender professionnel 2L', category:'Electromenager', price:39900, oldPrice:45000, badge:'Populaire', image:'https://images.unsplash.com/photo-1570222094114-d054a817e56b?w=600&auto=format&fit=crop&q=80', rating:4.7, reviewsCount:94, description:'Blender ultra puissant idéal pour smoothies et soupes.', specs:['Moteur 1800W','Bol 2L','6 Lames inox'] },
  { id:'prod-3', name:'Set de casseroles inox 10 pcs', category:'Ustensiles', price:49900, oldPrice:58000, badge:'Bestseller', image:'https://images.unsplash.com/photo-1584992236310-6edddc08acff?w=600&auto=format&fit=crop&q=80', rating:4.9, reviewsCount:210, description:'Ensemble complet premium en acier inoxydable 18/10.', specs:['Inox haute qualité','Fond thermo-diffuseur','Couvercles verre trempé'] },
  { id:'prod-4', name:'Bouilloire électrique 1.7L', category:'Petits appareils', price:12900, oldPrice:15000, badge:'Promo', image:'https://images.unsplash.com/photo-1594212699903-ec8a3eca50f6?w=600&auto=format&fit=crop&q=80', rating:4.5, reviewsCount:67, description:'Bouilloire rapide avec arrêt automatique.', specs:['Capacité 1.7L','Puissance 2200W','Socle 360°'] },
  { id:'prod-5', name:'Micro-ondes 20L Numérique', category:'Electromenager', price:54900, oldPrice:62000, badge:'En stock', image:'https://images.unsplash.com/photo-1585659722983-3a675dabf23d?w=600&auto=format&fit=crop&q=80', rating:4.6, reviewsCount:82, description:'Micro-ondes moderne avec programmes automatiques.', specs:['Capacité 20L','700W','8 programmes'] },
  { id:'prod-6', name:'Set de couteaux 6 pcs', category:'Ustensiles', price:19900, oldPrice:24000, badge:'Top Qualité', image:'https://images.unsplash.com/photo-1593618998160-e34014e67546?w=600&auto=format&fit=crop&q=80', rating:4.8, reviewsCount:115, description:'Bloc de couteaux professionnels affûtés.', specs:['Acier inox','Bloc bois','Ciseaux inclus'] }
];
const FALLBACK_IMG = 'https://placehold.co/400x400/034B22/FFFFFF?text=E-CM';
const ADMIN_PIN_HASHES = ['03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4'];
const ADMIN_SESSION_MS = 15 * 60 * 1000;
const STORAGE_KEYS = { products:'ecm_products_v2', cart:'ecm_cart_v2', favorites:'ecm_favorites_v2', orders:'ecm_orders_v2', onboarded:'ecm_onboarded_v2' };

let products = loadJSON(STORAGE_KEYS.products, DEFAULT_PRODUCTS);
let cart = loadJSON(STORAGE_KEYS.cart, []);
let favorites = loadJSON(STORAGE_KEYS.favorites, ['prod-1','prod-3']);
let orders = loadJSON(STORAGE_KEYS.orders, []);
let isAdminUnlocked = false, adminUnlockedAt = 0, editingProductId = null;
let activeTab = 'home', selectedCategory = 'Tous', searchQuery = '', searchDebounceTimer = null;
let activeProductDetail = null, activeOrderId = null, currentDetailQty = 1;
let selectedShipping = 2000, selectedPayment = 'Orange Money';

function loadJSON(k, f) { try { const r = localStorage.getItem(k); if (!r) return f; const p = JSON.parse(r); return Array.isArray(p) ? p : f; } catch { return f; } }
function saveData() { try { localStorage.setItem(STORAGE_KEYS.products, JSON.stringify(products)); localStorage.setItem(STORAGE_KEYS.cart, JSON.stringify(cart)); localStorage.setItem(STORAGE_KEYS.favorites, JSON.stringify(favorites)); localStorage.setItem(STORAGE_KEYS.orders, JSON.stringify(orders)); } catch(e){} updateCartBadge(); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function normalize(s) { return String(s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function formatPrice(a) { const n = Number(a) || 0; return new Intl.NumberFormat('fr-FR').format(n) + ' F CFA'; }
function safeNumber(v) { const n = Number(v); return Number.isFinite(n) && n >= 0 ? n : 0; }
function pct(p) { return p.oldPrice && p.oldPrice > p.price ? Math.round((1 - p.price / p.oldPrice) * 100) : 0; }
async function sha256(t) { if (!window.crypto || !window.crypto.subtle) { let h = 0; for (let i=0;i<t.length;i++) h = ((h<<5)-h+t.charCodeAt(i))|0; return 'fallback_'+h; } const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join(''); }
function showToast(m) { const t = document.getElementById('toast'); if (!t) return; document.getElementById('toast-message').textContent = m; t.classList.remove('opacity-0','-translate-y-4','pointer-events-none'); t.classList.add('opacity-100','translate-y-0'); clearTimeout(showToast._t); showToast._t = setTimeout(() => { t.classList.add('opacity-0','-translate-y-4','pointer-events-none'); t.classList.remove('opacity-100','translate-y-0'); }, 2600); }
function updateCartBadge() { const b = document.getElementById('cart-badge'); if (!b) return; const c = cart.reduce((a,i) => a + i.qty, 0); if (c > 0) { b.textContent = c; b.classList.remove('hidden'); } else b.classList.add('hidden'); }
function updateTime() { const e = document.getElementById('current-time'); if (e) e.textContent = new Date().toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' }); }
function getFiltered() { return products.filter(p => { const ok = selectedCategory === 'Tous' || p.category === selectedCategory; if (!ok) return false; if (!searchQuery) return true; const q = normalize(searchQuery); return normalize(p.name).includes(q) || normalize(p.category).includes(q); }); }
function checkAdminSession() { if (!isAdminUnlocked) return false; if (Date.now() - adminUnlockedAt > ADMIN_SESSION_MS) { isAdminUnlocked = false; adminUnlockedAt = 0; return false; } return true; }

function navigateTo(tab, extra = null) {
  if (tab === 'admin' && !checkAdminSession()) { openAdminLockModal(); return; }
  activeTab = tab;
  const main = document.getElementById('main-content'), nav = document.getElementById('bottom-nav');
  document.querySelectorAll('.nav-btn').forEach(b => { b.classList.remove('text-ecm-green','font-bold'); b.classList.add('text-slate-400','font-medium'); });
  const cur = document.querySelector(`.nav-btn[data-nav="${tab}"]`);
  if (cur) { cur.classList.remove('text-slate-400','font-medium'); cur.classList.add('text-ecm-green','font-bold'); }
  if (['splash','onboarding','checkout-step1','checkout-step2','order-success'].includes(tab)) nav.classList.add('hidden'); else nav.classList.remove('hidden');
  switch (tab) {
    case 'splash': renderSplash(); break;
    case 'onboarding': renderOnboarding(); break;
    case 'home': renderHome(); break;
    case 'catalog': renderCatalog(); break;
    case 'product-detail': currentDetailQty = 1; if (extra) activeProductDetail = extra; if (!activeProductDetail) { navigateTo('home'); return; } renderDetail(activeProductDetail); break;
    case 'cart': renderCart(); break;
    case 'checkout-step1': renderCheckout1(); break;
    case 'checkout-step2': renderCheckout2(); break;
    case 'order-success': renderSuccess(extra); break;
    case 'order-tracking': activeOrderId = extra || activeOrderId; renderTracking(activeOrderId); break;
    case 'orders': renderOrders(); break;
    case 'account': renderAccount(); break;
    case 'favorites': renderFavorites(); break;
    case 'notifications': renderNotifications(); break;
    case 'contact': renderContact(); break;
    case 'admin': renderAdmin(); break;
    default: renderHome();
  }
  if (window.lucide) lucide.createIcons();
  if (main) main.scrollTop = 0;
}

function openAdminLockModal() { if (checkAdminSession()) { navigateTo('admin'); return; } const m = document.getElementById('admin-lock-modal'); m.classList.remove('hidden'); const i = document.getElementById('admin-pin-input'); i.value = ''; document.getElementById('pin-error').classList.add('hidden'); setTimeout(() => i.focus(), 50); }
function closeAdminLockModal() { document.getElementById('admin-lock-modal').classList.add('hidden'); }
async function verifyAdminPin(e) { e.preventDefault(); const i = document.getElementById('admin-pin-input'); const p = i.value.trim(); const err = document.getElementById('pin-error'); if (!p) { err.classList.remove('hidden'); return; } const h = await sha256(p); if (ADMIN_PIN_HASHES.includes(h)) { isAdminUnlocked = true; adminUnlockedAt = Date.now(); closeAdminLockModal(); showToast('Session Administrateur active'); navigateTo('admin'); } else { err.classList.remove('hidden'); i.value = ''; i.focus(); } }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const m = document.getElementById('admin-lock-modal'); if (m && !m.classList.contains('hidden')) closeAdminLockModal(); } });

function renderSplash() { document.getElementById('main-content').innerHTML = `
  <div class="h-full bg-gradient-to-b from-ecm-green-dark via-ecm-green to-ecm-green text-white p-6 flex flex-col justify-between items-center text-center screen-fade">
    <div class="pt-10">
      <div class="w-20 h-20 bg-ecm-orange rounded-3xl flex items-center justify-center mx-auto shadow-2xl mb-4 border-2 border-white/20"><i data-lucide="shopping-cart" class="w-10 h-10 text-white"></i></div>
      <h1 class="text-3xl font-black">E-CM</h1>
      <p class="text-[11px] text-emerald-200 uppercase tracking-widest font-extrabold mt-1">Ustensiles de cuisine & Électroménager</p>
      <span class="inline-block mt-3 bg-white/10 px-3 py-1 rounded-full text-[10px] text-emerald-100 font-semibold border border-white/15">Édité par Issa Camara</span>
    </div>
    <div class="my-auto space-y-4">
      <h2 class="text-xl font-extrabold leading-snug px-4">Tout pour votre cuisine et votre maison</h2>
      <div class="grid grid-cols-2 gap-3 max-w-xs mx-auto pt-2">
        <img src="https://images.unsplash.com/photo-1626143509930-b18429ef994e?w=300&auto=format&fit=crop&q=80" onerror="this.src='${FALLBACK_IMG}'" class="rounded-2xl shadow-lg h-28 w-full object-cover border border-white/20">
        <img src="https://images.unsplash.com/photo-1584992236310-6edddc08acff?w=300&auto=format&fit=crop&q=80" onerror="this.src='${FALLBACK_IMG}'" class="rounded-2xl shadow-lg h-28 w-full object-cover border border-white/20">
      </div>
    </div>
    <div class="w-full pb-4"><button onclick="navigateTo('onboarding')" class="w-full bg-ecm-orange text-white py-4 rounded-2xl font-bold shadow-xl flex items-center justify-center space-x-2"><span>Découvrir l'application</span><i data-lucide="arrow-right" class="w-5 h-5"></i></button></div>
  </div>`; }

function renderOnboarding() { document.getElementById('main-content').innerHTML = `
  <div class="h-full bg-white p-6 flex flex-col justify-between items-center text-center screen-fade">
    <div class="pt-4 w-full flex justify-between items-center">
      <div class="flex items-center space-x-2"><div class="w-8 h-8 bg-ecm-orange rounded-xl flex items-center justify-center"><i data-lucide="shopping-cart" class="w-4 h-4 text-white"></i></div><span class="font-extrabold text-ecm-green">E-CM</span></div>
      <button onclick="finishOnboarding()" class="text-xs text-slate-400 font-bold uppercase">Passer</button>
    </div>
    <div class="my-auto space-y-4">

function handleProductSubmit(e) { e.preventDefault(); const n = document.getElementById('admin-name').value.trim(); const p = safeNumber(document.getElementById('admin-price').value); const o = document.getElementById('admin-old-price').value.trim(); const op = o ? safeNumber(o) : null; const c = document.getElementById('admin-category').value; const img = document.getElementById('admin-image').value.trim(); const d = document.getElementById('admin-description').value.trim() || 'Produit certifié E-CM.'; if (!n || p <= 0 || !img) { showToast('Champs invalides'); return; } if (editingProductId) { const i = products.findIndex(x => x.id === editingProductId); if (i !== -1) { products[i] = { ...products[i], name:n, price:p, oldPrice: op && op > p ? op : null, category:c, image:img, description:d }; showToast('Mis à jour'); } editingProductId = null; } else { products.unshift({ id:'prod-' + Date.now(), name:n, price:p, oldPrice: op && op > p ? op : null, category:c, image:img, badge:'Nouveau', rating:5, reviewsCount:1, description:d, specs:['Garantie E-CM','Produit Authentique'] }); showToast('Article ajouté !'); } saveData(); renderAdmin(); if (window.lucide) lucide.createIcons(); }
function editProduct(id) { if (!products.some(p => p.id === id)) return; editingProductId = id; renderAdmin(); if (window.lucide) lucide.createIcons(); }
function deleteProduct(id) { const p = products.find(x => x.id === id); if (!p) return; if (!confirm(`Supprimer « ${p.name} » ?`)) return; products = products.filter(x => x.id !== id); cart = cart.filter(x => x.id !== id); favorites = favorites.filter(x => x !== id); saveData(); showToast('Supprimé'); renderAdmin(); if (window.lucide) lucide.createIcons(); }

/* ==================== INIT ==================== */
window.onload = function() {
  products = products.filter(p => p && p.id && p.name);
  cart = cart.filter(i => i && i.id && products.some(p => p.id === i.id));
  favorites = favorites.filter(id => products.some(p => p.id === id));
  updateTime(); setInterval(updateTime, 30000); updateCartBadge();
  let ob = false; try { ob = localStorage.getItem(STORAGE_KEYS.onboarded) === '1'; } catch {}
  navigateTo(ob ? 'home' : 'splash');

  let deferredPrompt = null;
  const prompt = document.getElementById('install-prompt');
  const btn = document.getElementById('install-btn');
  const close = document.getElementById('install-close');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if (!localStorage.getItem('ecm_install_dismissed')) {
      prompt.classList.remove('hidden');
      if (window.lucide) lucide.createIcons();
    }
  });

  btn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') showToast('Installation lancée !');
    deferredPrompt = null;
    prompt.classList.add('hidden');
  });

  close.addEventListener('click', () => {
    prompt.classList.add('hidden');
    try { localStorage.setItem('ecm_install_dismissed', '1'); } catch {}
  });

  window.addEventListener('appinstalled', () => { prompt.classList.add('hidden'); showToast('E-CM installée !'); });
};
</script>
